<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f9f9f6;
      color: #333;
    }

    .countdown-container {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    /* Animation Styles */
    .animated-number {
      display: inline-block;
      position: relative;
      overflow: hidden;
      vertical-align: bottom;
    }

    .animated-number span {
      display: inline-block;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    .animated-number .digit-out {
      position: absolute;
      left: 0;
      top: 0;
      transform: translateY(100%);
      opacity: 0;
    }

    .animated-number .digit-in {
      animation: slideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes slideIn {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Big Days Layout */
    .days-box {
      margin-bottom: 24px;
    }

    .days-number {
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1;
      color: #2c3e50;
      min-height: 5.5rem;
    }

    .days-label {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #7f8c8d;
      margin-top: 8px;
    }

    /* Sub-units Layout */
    .sub-units {
      display: flex;
      justify-content: center;
      gap: 20px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .unit-box {
      display: flex;
      flex-direction: column;
      min-width: 65px;
    }

    .unit-number {
      font-size: 1.8rem;
      font-weight: 600;
      color: #34495e;
      min-height: 1.8rem;
    }

    .unit-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #95a5a6;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="countdown-container">
    <!-- Big Days Display -->
    <div class="days-box">
      <div class="days-number">
        <span id="days" class="animated-number"><span>000</span></span>
      </div>
      <div class="days-label">Days</div>
    </div>

    <!-- Smaller Units Below -->
    <div class="sub-units">
      <div class="unit-box">
        <span class="unit-number"><span id="hours" class="animated-number"><span>00</span></span></span>
        <span class="unit-label">Hours</span>
      </div>
      <div class="unit-box">
        <span class="unit-number"><span id="minutes" class="animated-number"><span>00</span></span></span>
        <span class="unit-label">Mins</span>
      </div>
      <div class="unit-box">
        <span class="unit-number"><span id="seconds" class="animated-number"><span>00</span></span></span>
        <span class="unit-label">Secs</span>
      </div>
    </div>
  </div>

  <script>
    const targetDate = new Date('2027-06-10T00:00:00').getTime();

    // Helper to animate individual value changes
    function updateAnimatedValue(id, newValue) {
      const container = document.getElementById(id);
      const currentSpan = container.querySelector('span');

      // Only animate if the text content has changed
      if (!currentSpan || currentSpan.innerText !== newValue) {
        const newSpan = document.createElement('span');
        newSpan.innerText = newValue;
        newSpan.classList.add('digit-in');

        if (currentSpan) {
          currentSpan.classList.add('digit-out');
          setTimeout(() => currentSpan.remove(), 350);
        }

        container.appendChild(newSpan);
      }
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector('.countdown-container').innerHTML = '<h2>The big day is here!</h2>';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      updateAnimatedValue('days', String(days));
      updateAnimatedValue('hours', String(hours).padStart(2, '0'));
      updateAnimatedValue('minutes', String(minutes).padStart(2, '0'));
      updateAnimatedValue('seconds', String(seconds).padStart(2, '0'));
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
